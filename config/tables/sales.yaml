    type: decimal
    nullable: true
    precision: 20
    scale: 8

  bp_shared_gp:
    type: decimal
    nullable: true
    precision: 20
    scale: 8

  cc_direct_rev:
    type: decimal
    nullable: true
    precision: 20
    scale: 10

  cc_direct_gp:
    type: decimal
    nullable: true
    precision: 20
    scale: 10

  cc_shared_rev:
    type: decimal
    nullable: true
    precision: 20
    scale: 10

  cc_shared_gp:
