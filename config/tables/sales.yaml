        - Sales office Description
        - Sales Office Description
      required: false

    sales_group_description:
      aliases:
        - salesgroupdesc
        - Sales Group Description
      required: false

    profitcentersbudesc:
      aliases:
        - ProfitCenterSBUDesc
        - Profit Center SBU Description
      required: false

    fiscal_period:
      aliases:
        - FISCAL PERIOD
        - Fiscal Period
      required: true

    ship_to:
      aliases:
        - ShipTo
        - Ship To
      required: false

    ship_to_description:
      aliases:
        - shiptodesc
        - ShipToDesc
        - Ship To Description
      required: false

    ship_to_city:
      aliases:
        - shiptocity
        - ShipToCity
        - Ship To City
      required: false

    employee_id:
