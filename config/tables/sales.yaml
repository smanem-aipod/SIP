# =========================================================
# VALIDATION
# =========================================================

validations:

  required_columns:
    - sales_target_sk
    - reporting_line
    - region
    - bu
    - fiscal_period
    - currency_code

  regex:
    currency_code: "^[A-Z]{3}$"

    fiscal_period: "^[0-9]{7}$"


# =========================================================
# SAME-TABLE DERIVED COLUMNS
# =========================================================

derived_columns:

  ytd_rev:
    enabled: true
    stage: after_enrichment
    operation: sum

    inputs:
      - cc_direct_rev
      - cc_shared_rev

    null_as_zero: true


  ytd_gp:
    enabled: true
    stage: after_enrichment
    operation: sum

    inputs:
      - cc_direct_gp
      - cc_shared_gp

    null_as_zero: true

  sa_materials:
    enabled: true
    stage: after_enrichment
    operation: supply_point_sa_classification

    inputs:
      supply_point_name: supply_point_name

    null_value: "Null"
    null_result: "Non SA"
    non_null_result: "SA Materials"

  operational_sbu:
    enabled: true
    stage: after_enrichment
    operation: operational_sbu_classification

    inputs:
      column: profitcentersbudesc

    values:
      - "Tolled Products"
      - "Raw Materials"
      - "Equipment"
      - "Solenis Corporate & Support"
      - "Service"
      - "SG&A"
      - "BASF Products"
      - "GE Supply"
      - "NON PA"
      - "Others"
      - "Plant expenses"
      - "Water GE"
      - "Wood Prod"
      - "REAGENTS AND LABWARE"
      - "No SBU"
      - "Water GEWT"

    null_is_non_operational: true

    non_operational_result: "Non-Operational SBU"
    operational_result: "Operational SBU"

  low_margin_enrichment:
    enabled: true
    stage: after_enrichment
    operation: grouped_margin_enrichment

    group_by:
      - profitcentersbudesc
      - ship_to

    inputs:
      revenue: ytd_rev
      gp: ytd_gp

    threshold: 0.15
    zero_tolerance: 0.000001

    both_zero_result: "N/A"
    revenue_zero_gp_present_result: "OK"
    below_threshold_result: "Below 15%"
    pass_result: "OK"

    outputs:
      grouped_revenue: profitcenter_shipto_revenue
      grouped_gp: profitcenter_shipto_gp
      classification: low_margin_flag

  gp_flag:
    enabled: true
    stage: after_enrichment
    operation: gp_flag_classification

    inputs:
      exception: exceptions
      operational_sbu: operational_sbu
      sa_materials: sa_materials
      low_margin_flag: low_margin_flag

    non_operational_value: "Non-Operational SBU"
    sa_material_value: "SA Materials"
    acceptable_margin_value: "OK"

    pass_result: "OK"
    fail_result: "Not OK"   

  cam_low_margin_enrichment:
    enabled: true
    stage: after_enrichment
    operation: grouped_margin_enrichment

    require_non_null:
      - division_node

    group_by:
      - profitcentersbudesc
      - ship_to
      - division_node

    inputs:
      revenue: ytd_rev
      gp: ytd_gp

    threshold: 0.15
    zero_tolerance: 0.000001

    both_zero_result: "N/A"
    revenue_zero_gp_present_result: "OK"
    below_threshold_result: "Below 15%"
    pass_result: "OK"

    outputs:
      grouped_revenue: cam_profitcenter_shipto_division_revenue
      grouped_gp: cam_profitcenter_shipto_division_gp
      classification: cam_low_margin_flag

  gp_flag_cam:
    enabled: true
    stage: after_enrichment
    operation: gp_flag_cam_classification

    inputs:
      division_node: division_node
      exception: exceptions
      operational_sbu: operational_sbu
      sa_materials: sa_materials
      low_margin_flag: cam_low_margin_flag

    non_operational_value: "Non-Operational SBU"
    sa_material_value: "SA Materials"
    acceptable_margin_value: "OK"

    pass_result: "OK"
    fail_result: "Not OK"

lookups:

  - name: employee_reference
    enabled: true

    reference:
      layer: canonical
      object: employee

    # ---- OLD (v1): no reference_filters key existed here ----
    # (the reference read pulled every row in canonical.employee across
    # all runs ever executed, with no filtering at all)
    # ---- END OLD (v1) ----

    # ---- NEW (v2 change): scope the reference read to the current run ----
    # Without this, canonical.employee accumulates rows across every run
    # ever executed, and duplicate employee_id values across runs trip the
    # many_to_one cardinality check below (EnrichmentError: duplicate join
    # keys).
    reference_filters:  # v2 change
      pipeline_run_id:  # v2 change
        runtime_context: run_id  # v2 change
    # ---- END NEW (v2 change) ----

    join:
      type: left

      source_keys:
        - employee_id

      reference_keys:
        - employee_id

      cardinality: many_to_one

    outputs:
      preferred_name:
        source_column: preferred_name
        overwrite_existing: false



