        - EMP ID
        - Employee ID
      required: false

    material:
      aliases:
        - Material
      required: false

    material_description:
      aliases:
        - MaterialDesc
        - Material Description
      required: false

    supply_point_name:
      aliases:
        - SUPPLY_POINT_NAME
        - Supply Point Name
      required: false

    customergroupdesc:
      aliases:
        - CustomerGroupDesc
        - Customer Group Description
      required: false

    customergroup1desc:
      aliases:
        - CustomerGroup1Desc
        - Customer Group 1 Description
      required: false

    division_node:
      aliases:
        - DivisionNode
        - Division Node
      required: false

    division_node_desc:
      aliases:
        - DivisionNodeDesc
        - Division Node Description
      required: false

    division:
      aliases:
        - Division
      required: false

    company_code:
      aliases:
        - CompanyCode
        - Company Code
      required: false

    currency_code:
      aliases:
        - Currencycode
        - CurrencyCode
        - Currency Code
      required: true

    shared_acc_flag:
      aliases:
        - SHARED_ACC_FLAG
        - Shared Account Flag
      required: false

    split_share:
      aliases:
        - Split/Share
        - Split Share
      required: false

    bp_direct_rev:
      aliases:
        - BP_Direct_Rev
        - BP Direct Rev
      required: false

    bp_direct_gp:
      aliases:
        - BP_Direct_GP
        - BP Direct GP
      required: false

    bp_shared_rev:
      aliases:
        - BP_Shared_Rev
        - BP Shared Rev
      required: false

    bp_shared_gp:
      aliases:
        - BP_Shared_GP
        - BP Shared GP
      required: false

    cc_direct_rev:
      aliases:
        - $CC_Direct_Rev
        - CC_Direct_Rev
        - CC Direct Rev
      required: false

    cc_direct_gp:
      aliases:
        - $CC_Direct_GP
        - CC_Direct_GP
        - CC Direct GP
      required: false

    cc_shared_rev:
      aliases:
        - $CC_Shared_Rev
        - CC_Shared_Rev
        - CC Shared Rev
      required: false

    cc_shared_gp:
      aliases:
        - $CC_Shared_GP
        - CC_Shared_GP
        - CC Shared GP
      required: false

    comments:
      aliases:
        - Comments
        - Comment
      required: false

    preferred_name:
      aliases:
        - EMP Name
        - Employee name
        - Employee Name
      required: false

  exclude_unmapped_columns: true

  generated_values:
    record_source:
      runtime_parameter: record_source.sales


# =========================================================
# RAW.SALES → CANONICAL.SALES
# =========================================================

raw_to_canonical:
  direct_mappings:
    sales_target_sk: sales_target_sk
    reporting_line: reporting_line
    region: region
    bu: bu
    sales_district_description: sales_district_description
    sales_office_description: sales_office_description
    sales_group_description: sales_group_description
    profitcentersbudesc: profitcentersbudesc
    fiscal_period: fiscal_period
    ship_to: ship_to
    ship_to_description: ship_to_description
    ship_to_city: ship_to_city
    employee_id: employee_id
    material: material
    material_description: material_description
    supply_point_name: supply_point_name
    customergroupdesc: customergroupdesc
    customergroup1desc: customergroup1desc
    division_node: division_node
    division_node_desc: division_node_desc
    division: division
    company_code: company_code
    currency_code: currency_code
    shared_acc_flag: shared_acc_flag
    split_share: split_share
    bp_direct_rev: bp_direct_rev
    bp_direct_gp: bp_direct_gp
    bp_shared_rev: bp_shared_rev
    bp_shared_gp: bp_shared_gp
    cc_direct_rev: cc_direct_rev
    cc_direct_gp: cc_direct_gp
    cc_shared_rev: cc_shared_rev
    cc_shared_gp: cc_shared_gp
    preferred_name: preferred_name
    created_at: created_at


# =========================================================
# CLEANING
# =========================================================

cleaning:
  trim_strings: true
  collapse_internal_whitespace: true
  normalize_empty_strings: true

  null_markers:
    - ""
    - "#N/A"
    - "N/A"
    - "NA"
    - "null"
    - "None"
    - "-"

  uppercase:
    - reporting_line
    - region
    - bu
    - currency_code


# =========================================================
# CANONICAL DATATYPES
# =========================================================

