  region:
    type: string
    nullable: true
    max_length: 10

  bu:
    type: string
    nullable: true
    max_length: 100

  sales_district_description:
    type: string
    nullable: true
    max_length: 500

  sales_office_description:
    type: string
    nullable: true
    max_length: 500

  sales_group_description:
    type: string
    nullable: true
    max_length: 500

  profitcentersbudesc:
    type: string
    nullable: true
    max_length: 500

  fiscal_period:
    type: string
    nullable: true
    max_length: 7

  ship_to:
    type: string
    nullable: true
    max_length: 50

  ship_to_description:
    type: string
    nullable: true
    max_length: 500

  ship_to_city:
    type: string
    nullable: true
